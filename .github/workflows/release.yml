name: release

# Publishes to npm when the version in package.json changes on main. Auth is npm trusted publishing (OIDC):
# no NPM_TOKEN, provenance is attached automatically.
on:
  push:
    branches: [main]
    paths:
      - "package.json"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Detect version change
        id: version
        run: |
          LOCAL=$(jq -r .version package.json)
          PUBLISHED=$(npm view dotframe version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $PUBLISHED -> $LOCAL"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($LOCAL), skipping publish"
          fi

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Test
        if: steps.version.outputs.changed == 'true'
        run: |
          bun test
          bun x tsc -p tsconfig.json
          bun x tsc -p cli/tsconfig.json

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public

      - name: Tag and GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.local }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          # Notes: the CHANGELOG.md section for this version, up to the next "## " heading.
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            gh release create "v$VERSION" --title "v$VERSION" --notes-file /tmp/notes.md
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
