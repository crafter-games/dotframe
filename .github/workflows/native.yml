name: native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: npm install -g scriptc@0.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            vendor/wgpu
            vendor/SDL3-*
            vendor/build
          key: vendor-${{ hashFiles('scripts/vendor.sh', 'vendor/toolchain/**') }}
      - run: scripts/vendor.sh macos && scripts/vendor.sh windows
      - run: bunx tsc -p tsconfig.json
      - run: bun test
      - name: Build examples
        run: |
          for example in triangle suzanne smash-lite canvas2d; do
            scripts/build-native.sh macos $example
            scripts/build-native.sh windows $example
            scripts/build-web.sh $example
          done
          scripts/build-native.sh macos audio-check
          scripts/build-native.sh windows audio-check
          mkdir -p dist/macos dist/windows
          cp build/macos/triangle build/macos/suzanne build/macos/smash-lite build/macos/canvas2d build/macos/audio-check dist/macos/
          cp build/windows/triangle.exe build/windows/suzanne.exe build/windows/smash-lite.exe build/windows/canvas2d.exe build/windows/audio-check.exe dist/windows/
          cp tools/check-audio.ts dist/
          cp -R assets dist/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  run-macos:
    needs: build
    runs-on: macos-15
    steps:
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: binaries
      - name: Check the audio mix
        run: |
          chmod +x macos/*
          SDL_AUDIO_DRIVER=disk SDL_AUDIO_DISK_OUTPUT_FILE=mix.raw ./macos/audio-check
          bun check-audio.ts mix.raw
      - name: Run and capture
        run: |
          chmod +x macos/*
          curl -fsSLo cuse https://github.com/crafter-agents/cuse/releases/latest/download/cuse-macos-arm64
          chmod +x cuse
          export DF_DEMO=1
          for example in triangle suzanne smash-lite canvas2d; do
            ./macos/$example > $example.log 2>&1 &
            pid=$!
            sleep 8
            ./cuse capture $example.png || screencapture -x $example.png
            kill $pid || true
            sleep 1
            cat $example.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-macos
          path: |
            *.png
            *.log

  run-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: binaries
      - name: Check the audio mix
        shell: pwsh
        run: |
          $env:SDL_AUDIO_DRIVER = "disk"
          $env:SDL_AUDIO_DISK_OUTPUT_FILE = "mix.raw"
          ./windows/audio-check.exe
          bun check-audio.ts mix.raw
      - name: Run and capture
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/crafter-agents/cuse/releases/latest/download/cuse-windows-x64.exe -OutFile cuse.exe
          $env:DF_DEMO = "1"
          foreach ($example in "triangle", "suzanne", "smash-lite", "canvas2d") {
            $p = Start-Process "windows/$example.exe" -PassThru -RedirectStandardError "$example.err" -RedirectStandardOutput "$example.out"
            Start-Sleep -Seconds 10
            $alive = -not $p.HasExited
            "$example alive=$alive exit=$($p.ExitCode)" | Tee-Object -Append status.txt
            ./cuse.exe capture "$example.png"
            if ($alive) { Stop-Process -Id $p.Id -Force }
            Start-Sleep -Seconds 1
            Get-Content "$example.err", "$example.out" -ErrorAction SilentlyContinue
          }
          if ((Get-Content status.txt) -match "alive=False") { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-windows
          path: |
            *.png
            *.err
            *.out
            status.txt
